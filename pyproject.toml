[project]
name = "technocore-contribution-node"
version = "0.1.0"
description = "An open-source Technocore contribution node: a did:key agent that accepts signed jobs from other agents and publishes a verifiable receipt chain."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "AgentTeams" }]
keywords = ["did-key", "ed25519", "agent", "technocore", "receipts"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]
# Pinned exactly, and resolved together into uv.lock. A floating specifier would mean
# the build that passes CI and the build that runs are not the same build.
dependencies = [
  "fastapi==0.141.1",
  # Pinned directly, not left to fastapi's floor: `starlette>=0.46.0` resolves happily to
  # a release with known advisories, and this package imports starlette itself anyway.
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "pydantic==2.13.4",
  "httpx2==2.12.0",
  "cryptography==50.0.1",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
]

[project.scripts]
technocore-node = "technocore_node.cli.main:main"

[project.urls]
Homepage = "https://github.com/AgentTeams/technocore-contribution-node"
Source = "https://github.com/AgentTeams/technocore-contribution-node"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_node"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "BLE", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
# This file's whole job is to contain the invisible characters the sweep removes.
# Flagging them as "ambiguous" is exactly backwards here.
"tests/unit/test_sweep.py" = ["RUF001", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["technocore_node"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
